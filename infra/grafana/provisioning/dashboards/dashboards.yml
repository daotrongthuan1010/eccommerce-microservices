apiVersion: 1
providers:
  - name: spring-boot
    orgId: 1
    folder: Spring Boot
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/spring-boot
  - name: inventory-service
    orgId: 1
    folder: Inventory Service
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/inventory-service
