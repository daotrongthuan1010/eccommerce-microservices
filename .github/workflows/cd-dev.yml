name: cd-dev

# INDEPENDENT per-service deploy: each service is deployed by its own matrix job.
# A failure rolls back and fails ONLY that service's job — other services are untouched.
# Full ordered rollout (all 14) lives in cd-all.yml, which fans out per-service in waves.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all = every service, independently)'
        required: false
        default: all
        type: choice
        options:
          - all
          - discovery-service
          - api-gateway
          - auth-service
          - user-service
          - catalog-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service
          - search-service
          - product-service
          - review-service
          - analytics-service
          - file-service
      sha:
        description: 'Image tag (commit SHA) to deploy; defaults to HEAD sha'
        required: false
        default: ''

jobs:
  select:
    # Run on workflow completion (success OR partial failure): each service
    # deploys independently if its own image exists. Never gated on full CI green.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.out.outputs.services }}
      sha: ${{ steps.out.outputs.sha }}
    steps:
      - id: out
        run: |
          ALL='["discovery-service","api-gateway","auth-service","user-service","catalog-service","inventory-service","order-service","payment-service","notification-service","search-service","product-service","review-service","analytics-service","file-service"]'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.service }}" != "all" ]; then
            echo 'services=["${{ inputs.service }}"]' >> "$GITHUB_OUTPUT"
            SHA='${{ inputs.sha }}'
          else
            echo "services=$ALL" >> "$GITHUB_OUTPUT"
            SHA='${{ inputs.sha }}'
          fi
          # workflow_run event: deploy the HEAD sha that CI just built.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          if [ -z "$SHA" ]; then SHA="$(git ls-remote https://github.com/${{ github.repository }}.git develop | cut -f1)"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Deploy ${{ matrix.service }} (independent job)
        uses: ./.github/actions/deploy-service
        with:
          service: ${{ matrix.service }}
          sha: ${{ needs.select.outputs.sha }}
          host: ${{ secrets.VPS_SSH_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          iam_internal_token: ${{ secrets.IAM_INTERNAL_TOKEN }}
          keycloak_admin_client_secret: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
