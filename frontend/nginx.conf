# frontend/nginx.conf — SPA fallback: moi path khong phai file tinh
# tra ve index.html de React Router xu ly (deep-link /products/123).
# Cache: index.html KHONG cache (luon lay ban moi sau deploy — tranh loi
# "Failed to fetch dynamically imported module" do index cu tro chunk cu),
# assets co hash trong ten file nen cache lau + immutable an toan.
server {
  listen 80;
  listen [::]:80;
  root /usr/share/nginx/html;
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location / { try_files $uri $uri/ /index.html; }
}
