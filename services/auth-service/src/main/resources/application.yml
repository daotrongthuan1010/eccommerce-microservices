server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: auth-service
  data:
    redis:
      host: ${REDIS_HOST:162.4.177.91}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:local_redis_change_me}
      timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:162.4.177.91:9092}
    consumer:
      group-id: auth-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      properties:
        enable.idempotence: true
  datasource:
    url: ${DB_URL:jdbc:mysql://162.4.177.91:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:local_auth_change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      initialization-fail-timeout: 30000
  sql:
    init:
      mode: never
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://162.4.177.91:7080/realms/ecommerce}
auth:
  keycloak:
    token-uri: ${KEYCLOAK_TOKEN_URI:http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/token}
    logout-uri: ${KEYCLOAK_LOGOUT_URI:http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/logout}
    client-id: ${KEYCLOAK_CLIENT_ID:ecommerce-app}
    server-url: ${KEYCLOAK_SERVER_URL:http://162.4.177.91:7080}
    realm: ${KEYCLOAK_REALM:ecommerce}
    admin:
      # Service account cho Keycloak Admin API (register, forgot/change password, verify email).
      # De trong client-secret = tat cac endpoint do (tra 501 kem huong dan thu cong).
      # Tao 1 lan trong Keycloak Admin Console: Clients > Create client (confidential,
      # bat Service accounts roles), gan realm-management roles: manage-users, view-users.
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
      realm: ${KEYCLOAK_ADMIN_REALM:master}
iam:
  internal:
    # Shared secret cho goi service-to-service /internal/** (gateway gui qua header
    # X-Internal-Token). BAT BUOC dat IAM_INTERNAL_TOKEN khi deploy, de trong = tat kenh secret.
    token: ${IAM_INTERNAL_TOKEN:}
  provision:
    # JIT provisioning (P2): tao auth_users khi thay Keycloak sub la lan dau.
    enabled: ${IAM_PROVISION_ENABLED:true}
    # Ma tenant mac dinh (phai co trong seed). Bo trong = tao user muc he thong, khong quyen.
    default-tenant-code: ${IAM_DEFAULT_TENANT:}
    # Id group mac dinh. Bo comment + dat IAM_DEFAULT_GROUP_ID khi da seed group.
    # default-group-id: ${IAM_DEFAULT_GROUP_ID:}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://162.4.177.91:8761/eureka/}
    registry-fetch-interval-seconds: 15
  instance:
    hostname: ${EUREKA_HOSTNAME:auth-service}
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://162.4.177.91:9411/api/v2/spans}
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: auth-service
    stage: scaffold
