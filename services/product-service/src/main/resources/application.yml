server:
  port: ${SERVER_PORT:8092}

spring:
  application:
    name: product-service

  # =========================
  # DATASOURCE - POSTGRESQL
  # =========================
  datasource:
    url: ${DB_URL:jdbc:postgresql://162.4.177.91:5432/product_db}
    username: ${DB_USERNAME:product_user}
    password: ${DB_PASSWORD:local_product_change_me}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: ProductServiceHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 60000
      initialization-fail-timeout: 30000

  # =========================
  # JPA / HIBERNATE
  # =========================
  jpa:
    open-in-view: false

    hibernate:
      # Chỉ nên dùng update khi đang phát triển.
      # Production nên dùng Flyway/Liquibase và validate.
      ddl-auto: ${JPA_DDL_AUTO:update}

    show-sql: ${JPA_SHOW_SQL:false}

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

        # JDBC batching: gom nhiều câu lệnh INSERT/UPDATE
        # để giảm số lần trao đổi với database.
        jdbc:
          batch_size: ${HIBERNATE_BATCH_SIZE:50}
          batch_versioned_data: true

        # Gom các câu INSERT/UPDATE cùng loại khi có thể.
        order_inserts: true
        order_updates: true

        # Tối ưu truy vấn quan hệ theo lô khi phù hợp.
        default_batch_fetch_size: ${HIBERNATE_FETCH_BATCH_SIZE:100}

  # Không chạy schema/data.sql tự động.
  sql:
    init:
      mode: never

  # =========================
  # REDIS
  # =========================
  data:
    redis:
      host: ${REDIS_HOST:162.4.177.91}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:local_redis_change_me}
      timeout: 3s
      connect-timeout: 3s

  # =========================
  # KAFKA
  # =========================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:162.4.177.91:9092}

    consumer:
      group-id: product-service
      auto-offset-reset: earliest
      enable-auto-commit: false

    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

  # =========================
  # OAUTH2 / KEYCLOAK
  # =========================
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs}

# =========================
# EUREKA SERVICE DISCOVERY
# =========================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://162.4.177.91:8761/eureka/}
    registry-fetch-interval-seconds: 15

  instance:
    hostname: ${EUREKA_HOSTNAME:product-service}
    prefer-ip-address: false

# =========================
# GRPC
# =========================
grpc:
  client:
    file-service:
      address: ${FILE_SERVICE_GRPC_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext

  server:
    port: ${GRPC_SERVER_PORT:9089}

# =========================
# MINIO
# =========================
storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://162.4.177.91:9000}
    access-key: ${MINIO_ACCESS_KEY:local_minio_admin}
    secret-key: ${MINIO_SECRET_KEY:local_minio_change_me}
    bucket: ${MINIO_BUCKET:product-assets}

# =========================
# OUTBOX
# =========================
app:
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}

# =========================
# ACTUATOR / MONITORING
# =========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  info:
    env:
      enabled: true

  tracing:
    # 1.0 thu thập toàn bộ trace; tăng overhead khi tải cao.
    # Có thể đặt TRACING_SAMPLING_PROBABILITY=0.1 trên server.
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://162.4.177.91:9411/api/v2/spans}

# =========================
# APPLICATION INFO
# =========================
info:
  app:
    name: product-service
    stage: ${APP_STAGE:development}
