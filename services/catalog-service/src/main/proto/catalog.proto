syntax = "proto3";

package ecommerce.catalog.v1;

option java_multiple_files = true;
option java_package = "com.dtthuan3.ecommerce.catalogservice.grpc";
option java_outer_classname = "CatalogProto";

// Base contract only — replace Ping with real catalog RPCs when implementing.
service CatalogService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}
