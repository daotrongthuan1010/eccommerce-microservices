server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: catalog-service

  # =========================================================
  # REDIS
  # =========================================================
  data:
    redis:
      host: ${REDIS_HOST:162.4.177.91}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:local_redis_change_me}
      timeout: 3s

  # =========================================================
  # POSTGRESQL
  # =========================================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://162.4.177.91:5432/catalog_db}
    username: ${DB_USERNAME:catalog_user}
    password: ${DB_PASSWORD:local_catalog_change_me}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      initialization-fail-timeout: 30000

  # =========================================================
  # JPA / HIBERNATE
  # =========================================================
  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  # =========================================================
  # SQL INIT
  # =========================================================
  sql:
    init:
      mode: never

  # =========================================================
  # KAFKA
  # =========================================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:162.4.177.91:9092}

    consumer:
      group-id: catalog-service
      auto-offset-reset: earliest
      enable-auto-commit: false

    producer:
      acks: all

      properties:
        enable.idempotence: true

  # =========================================================
  # KEYCLOAK / OAUTH2 RESOURCE SERVER
  # =========================================================
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs}


# =========================================================
# EUREKA
# =========================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://162.4.177.91:8761/eureka/}

    registry-fetch-interval-seconds: 15

  instance:
    hostname: ${EUREKA_HOSTNAME:catalog-service}
    prefer-ip-address: false


# =========================================================
# gRPC SERVER
# =========================================================
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9083}


# =========================================================
# FILE SERVICE
# =========================================================
# Catalog KHÔNG kết nối trực tiếp tới MinIO.
# Catalog gọi File Service.
file-service:
  url: ${FILE_SERVICE_URL:http://162.4.177.91:8095}


# =========================================================
# ACTUATOR / MONITORING
# =========================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never

      probes:
        enabled: true

  info:
    env:
      enabled: true

  tracing:
    enabled: false

    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://162.4.177.91:9411/api/v2/spans}


# =========================================================
# APPLICATION INFO
# =========================================================
info:
  app:
    name: catalog-service
    stage: scaffold


# =========================================================
# LOGGING
# =========================================================
logging:
  level:
    org.springframework.security: DEBUG