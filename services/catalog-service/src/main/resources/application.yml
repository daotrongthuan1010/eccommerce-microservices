server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: catalog-service

  cloud:
    openfeign:
      client:
        config:
          product-service:
            connectTimeout: ${PRODUCT_API_CONNECT_TIMEOUT:1000}
            readTimeout: ${PRODUCT_API_READ_TIMEOUT:2000}

  security:
    oauth2:
      client:
        registration:
          catalog-search-reader:
            provider: catalog-keycloak
            client-id: ${CATALOG_SEARCH_CLIENT_ID:catalog-service}
            client-secret: ${CATALOG_SEARCH_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          catalog-keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/token}
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs}

  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://162.4.177.91:9200}
    connection-timeout: ${ELASTICSEARCH_CONNECT_TIMEOUT:1s}
    socket-timeout: ${ELASTICSEARCH_SOCKET_TIMEOUT:2s}

  data:
    redis:
      host: ${REDIS_HOST:162.4.177.91}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:local_redis_change_me}
      timeout: 3s

  datasource:
    url: ${DB_URL:jdbc:postgresql://162.4.177.91:5432/catalog_db}
    username: ${DB_USERNAME:catalog_user}
    password: ${DB_PASSWORD:local_catalog_change_me}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      initialization-fail-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:162.4.177.91:9092}

    consumer:
      group-id: catalog-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
    listener:
      ack-mode: record

    producer:
      acks: all
      properties:
        enable.idempotence: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://162.4.177.91:8761/eureka/}
    registry-fetch-interval-seconds: 15

  instance:
    hostname: ${EUREKA_HOSTNAME:catalog-service}
    prefer-ip-address: false

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9083}

file-service:
  url: ${FILE_SERVICE_URL:http://162.4.177.91:8095}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  info:
    env:
      enabled: true

  tracing:
    enabled: false
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://162.4.177.91:9411/api/v2/spans}

resilience4j:
  retry:
    instances:
      catalogSearch:
        max-attempts: 2
        wait-duration: 50ms
        retry-exceptions:
          - org.springframework.dao.DataAccessException
  circuitbreaker:
    instances:
      catalogSearch:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.dao.DataAccessException

info:
  app:
    name: catalog-service
    stage: scaffold

logging:
  level:
    org.springframework.security: DEBUG

catalog:
  search:
    index:
      bootstrap-enabled: ${CATALOG_SEARCH_INDEX_BOOTSTRAP_ENABLED:false}
    kafka:
      replication-factor: ${CATALOG_SEARCH_KAFKA_REPLICATION_FACTOR:1}
    replay:
      max-events-per-second: ${CATALOG_SEARCH_REPLAY_MAX_EVENTS_PER_SECOND:5}
    events:
      product-topic: ${PRODUCT_EVENTS_TOPIC:product-events}
      group-id: ${PRODUCT_SEARCH_PROJECTION_GROUP:catalog-product-search-projection}
      concurrency: ${PRODUCT_EVENTS_CONCURRENCY:3}
