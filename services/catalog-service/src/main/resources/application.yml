server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: catalog-service

  data:
    redis:
      host: ${REDIS_HOST:162.4.177.91}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:local_redis_change_me}
      timeout: 3s

  datasource:
    url: ${DB_URL:jdbc:postgresql://162.4.177.91:5432/catalog_db}
    username: ${DB_USERNAME:catalog_user}
    password: ${DB_PASSWORD:local_catalog_change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      initialization-fail-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:162.4.177.91:9092}
    consumer:
      group-id: catalog-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      properties:
        enable.idempotence: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://162.4.177.91:8761/eureka/}
    registry-fetch-interval-seconds: 15

  instance:
    hostname: ${EUREKA_HOSTNAME:catalog-service}
    prefer-ip-address: false

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  tracing:
    enabled: false
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://162.4.177.91:9411/api/v2/spans

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  info:
    env:
      enabled: true

info:
  app:
    name: catalog-service
    stage: scaffold

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://162.4.177.91:9000}
    access-key: ${MINIO_ACCESS_KEY:local_minio_admin}
    secret-key: ${MINIO_SECRET_KEY:local_minio_change_me}
    bucket: ${MINIO_BUCKET:product-assets}

logging:
  level:
    org.springframework.security: DEBUG