syntax = "proto3";

package ecommerce.order.v1;

option java_multiple_files = true;
option java_package = "com.dtthuan3.ecommerce.orderservice.grpc";
option java_outer_classname = "OrderProto";

// Base contract only — replace Ping with real order RPCs when implementing.
service OrderService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}
