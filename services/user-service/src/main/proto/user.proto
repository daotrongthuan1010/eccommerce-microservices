syntax = "proto3";

package ecommerce.user.v1;

option java_multiple_files = true;
option java_package = "com.dtthuan3.ecommerce.userservice.grpc";
option java_outer_classname = "UserProto";

// Base contract only — replace Ping with real user RPCs when implementing.
service UserService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}
