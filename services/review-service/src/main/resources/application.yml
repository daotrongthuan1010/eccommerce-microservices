server:
  port: ${SERVER_PORT:8093}

spring:
  application:
    name: review-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://162.4.177.91:5432/review_db}
    username: ${DB_USERNAME:review_user}
    password: ${DB_PASSWORD:local_review_change_me}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      initialization-fail-timeout: 30000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  # Không tự chạy schema.sql / data.sql
  sql:
    init:
      mode: never

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:162.4.177.91}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:local_redis_change_me}
      timeout: 3s

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:162.4.177.91:9092}

    consumer:
      group-id: review-service
      auto-offset-reset: earliest
      enable-auto-commit: false

    producer:
      acks: all
      properties:
        enable.idempotence: true

  # Keycloak / JWT
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs}


# Eureka
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://162.4.177.91:8761/eureka/}

    registry-fetch-interval-seconds: 15

  instance:
    hostname: ${EUREKA_HOSTNAME:review-service}
    prefer-ip-address: false


# gRPC
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}


# Actuator / Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://162.4.177.91:9411/api/v2/spans}

  info:
    env:
      enabled: true


info:
  app:
    name: review-service
    stage: scaffold