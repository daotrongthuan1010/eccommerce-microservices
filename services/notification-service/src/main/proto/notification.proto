syntax = "proto3";

package ecommerce.notification.v1;

option java_multiple_files = true;
option java_package = "com.dtthuan3.ecommerce.notificationservice.grpc";
option java_outer_classname = "NotificationProto";

// Base contract only — replace Ping with real notification RPCs when implementing.
service NotificationService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}
