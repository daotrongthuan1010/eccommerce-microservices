server:
  port: ${SERVER_PORT:8087}
spring:
  application:
    name: notification-service
  data:
    redis:
      host: ${REDIS_HOST:162.4.177.91}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:local_redis_change_me}
      timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:162.4.177.91:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      properties:
        enable.idempotence: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://162.4.177.91:5432/notification_db}
    username: ${DB_USERNAME:notification_user}
    password: ${DB_PASSWORD:local_notification_change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      initialization-fail-timeout: 30000
  sql:
    init:
      mode: never
  # Flyway so huu schema (V1__notification_init.sql); JPA chi validate.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://162.4.177.91:8761/eureka/}
    registry-fetch-interval-seconds: 15
  instance:
    hostname: ${EUREKA_HOSTNAME:notification-service}
    prefer-ip-address: false
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9087}

notification:
  kafka:
    order-events-topic: ${ORDER_EVENTS_TOPIC:order-events}
  mail:
    api-base: ${MAILPIT_API_BASE:http://localhost:8025}
    smtp-host: ${MAILPIT_SMTP_HOST:localhost}
    smtp-port: ${MAILPIT_SMTP_PORT:1025}
    from: ${NOTIFICATION_FROM:shop@shop-hatd.online}
    send-timeout: 10s
  retry:
    max-attempts: 5
    initial-backoff: 1m
    max-backoff: 10m
  worker:
    poll-interval-ms: 2000
    batch-size: 100
    concurrency: 8

auth:
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://162.4.177.91:7080}
    realm: ${KEYCLOAK_REALM:ecommerce}
    admin:
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
      realm: ${KEYCLOAK_ADMIN_REALM:master}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://162.4.177.91:9411/api/v2/spans}
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: notification-service
    stage: scaffold
