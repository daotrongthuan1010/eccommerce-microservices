server:
  port: ${SERVER_PORT:8088}
spring:
  application:
    name: search-service
  data:
    redis:
      host: ${REDIS_HOST:162.4.177.91}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:local_redis_change_me}
      timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:162.4.177.91:9092}
    listener:
      ack-mode: manual
    consumer:
      group-id: search-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      # Topic product-events co record test cu KHONG phai JSON ("ext-test-...")
      # → phai boc JsonDeserializer trong ErrorHandlingDeserializer de record
      # do bi bo qua thay vi kẹt consumer o offset 0 mai mai.
      key-deserializer: org.apache.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: java.util.LinkedHashMap
        spring.json.use.type.headers: false
    producer:
      acks: all
      properties:
        enable.idempotence: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://162.4.177.91:9200}
    connection-timeout: 3s
    socket-timeout: 10s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://162.4.177.91:8761/eureka/}
    registry-fetch-interval-seconds: 15
  instance:
    hostname: ${EUREKA_HOSTNAME:search-service}
    prefer-ip-address: false
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9088}

# vi-search (2026-11-06): synonyms ap dung INDEX-TIME (analyzer vi_search) —
# them/sua dong phai reindex (POST /admin/reindex). Dang "a, b => c" hoac
# "a, b" (equivalent). Bo dau khong can: asciifolding da lam.
search:
  product-service:
    base-url: ${PRODUCT_SERVICE_URL:http://product-service}
  synonyms: ${SEARCH_SYNONYMS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://162.4.177.91:9411/api/v2/spans}
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: search-service
    stage: scaffold
