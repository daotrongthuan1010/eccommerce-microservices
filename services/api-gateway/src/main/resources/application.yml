server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: auth-service
            uri: ${AUTH_SERVICE_URL:lb://auth-service}
            predicates:
            - Path=/api/auth/**
            filters:
            - StripPrefix=1
          - id: user-service
            uri: ${USER_SERVICE_URL:lb://user-service}
            predicates:
            - Path=/api/user/**
            filters:
            - StripPrefix=2
          - id: catalog-service
            uri: ${CATALOG_SERVICE_URL:lb://catalog-service}
            predicates:
            - Path=/api/catalog/**
            filters:
            - StripPrefix=2
          - id: inventory-service
            uri: ${INVENTORY_SERVICE_URL:lb://inventory-service}
            predicates:
            - Path=/api/inventory/**
            filters:
            - StripPrefix=2
          - id: order-service
            uri: ${ORDER_SERVICE_URL:lb://order-service}
            predicates:
            - Path=/api/order/**
            filters:
            - StripPrefix=2
          - id: payment-service
            uri: ${PAYMENT_SERVICE_URL:lb://payment-service}
            predicates:
            - Path=/api/payment/**
            filters:
            - StripPrefix=2
          - id: notification-service
            uri: ${NOTIFICATION_SERVICE_URL:lb://notification-service}
            predicates:
            - Path=/api/notification/**
            filters:
            - StripPrefix=2
          - id: search-service
            uri: ${SEARCH_SERVICE_URL:lb://search-service}
            predicates:
            - Path=/api/search/**
            filters:
            - StripPrefix=2
          - id: product-service
            uri: ${PRODUCT_SERVICE_URL:lb://product-service}
            predicates:
            - Path=/api/product/**
            filters:
            - StripPrefix=2
          - id: review-service
            uri: ${REVIEW_SERVICE_URL:lb://review-service}
            predicates:
            - Path=/api/review/**
            filters:
            - StripPrefix=2
          - id: analytics-service
            uri: ${ANALYTICS_SERVICE_URL:lb://analytics-service}
            predicates:
            - Path=/api/analytics/**
            filters:
            - StripPrefix=2
          - id: file-service
            uri: ${FILE_SERVICE_URL:lb://file-service}
            predicates:
            - Path=/api/file/**
            filters:
            - StripPrefix=2
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://162.4.177.91:8761/eureka/}
    registry-fetch-interval-seconds: 15
  instance:
    hostname: ${EUREKA_HOSTNAME:api-gateway}
    prefer-ip-address: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://162.4.177.91:9411/api/v2/spans}
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: api-gateway
    stage: scaffold
