syntax = "proto3";

package ecommerce.inventory.v1;

option java_multiple_files = true;
option java_package = "com.dtthuan3.ecommerce.inventoryservice.grpc";
option java_outer_classname = "InventoryProto";

// Base contract only — replace Ping with real inventory RPCs when implementing.
service InventoryService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}
