syntax = "proto3";

package ecommerce.payment.v1;

option java_multiple_files = true;
option java_package = "com.dtthuan3.ecommerce.paymentservice.grpc";
option java_outer_classname = "PaymentProto";

// Base contract only — replace Ping with real payment RPCs when implementing.
service PaymentService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}
