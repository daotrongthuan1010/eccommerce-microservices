server:
  port: ${SERVER_PORT:8086}
spring:
  application:
    name: payment-service
  data:
    redis:
      host: ${REDIS_HOST:162.4.177.91}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:local_redis_change_me}
      timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:162.4.177.91:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      properties:
        enable.idempotence: true
  datasource:
    url: ${DB_URL:jdbc:mysql://162.4.177.91:3306/payment_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:payment_user}
    password: ${DB_PASSWORD:local_payment_change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      initialization-fail-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://162.4.177.91:8761/eureka/}
    registry-fetch-interval-seconds: 15
  instance:
    hostname: ${EUREKA_HOSTNAME:payment-service}
    prefer-ip-address: false
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9086}

# --- Payment domain config ---
payment:
  # URL ma fake-gateway goi IPN vao + order quay lai. Qua k8s la ten service noi bo.
  public-base-url: ${PAYMENT_PUBLIC_BASE_URL:http://payment-service:8086}
  pending-ttl: ${PAYMENT_PENDING_TTL:15m}
  reconcile-after: ${PAYMENT_RECONCILE_AFTER:5m}
  fake-gateway-url: ${FAKE_GATEWAY_URL:http://localhost:8099}
  vnpay:
    secret: ${FAKE_VNPAY_SECRET:local_fake_vnpay_change_me}
    scenario: ${FAKE_VNPAY_SCENARIO:}
  zalopay:
    secret: ${FAKE_ZALOPAY_SECRET:local_fake_zalopay_change_me}
    scenario: ${FAKE_ZALOPAY_SCENARIO:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://162.4.177.91:9411/api/v2/spans}
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: payment-service
    stage: implemented
