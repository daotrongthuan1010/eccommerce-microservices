apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping-config
  namespace: ecommerce
  labels:
    app: shipping-service
data:
  SERVER_PORT: "8089"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
  EUREKA_SERVER_URL: "http://discovery-service:8761/eureka/"
  EUREKA_HOSTNAME: "shipping-service"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  DB_URL: "jdbc:postgresql://postgres:5432/shipping_db"
  DB_USERNAME: "shipping_user"
  KEYCLOAK_JWK_SET_URI: "http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs"
  ZIPKIN_ENDPOINT: "http://tempo:9411/api/v2/spans"
  SHIPPING_PUBLIC_BASE_URL: "http://shipping-service:8089"
  FAKE_GATEWAY_URL: "http://fake-gateway-service:8099"
  # Secret gia lap (khong phai tien that) — chi dung de ky HMAC voi fake carrier, doi cung gia tri 2 phia.
  FAKE_CARRIER_SECRET: "local_fake_carrier_change_me"
