apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: ecommerce
  labels:
    app: notification-service
data:
  SERVER_PORT: "8087"
  # Heap 60% thay vi 75%: limit 768Mi, heap ~460MB, con lai cho metaspace +
  # 59 threads + kafka native buffers (75% da gay OOMKilled lan 2 khi don backlog).
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=10.0 -XX:+UseSerialGC"
  EUREKA_SERVER_URL: "http://discovery-service:8761/eureka/"
  EUREKA_HOSTNAME: "notification-service"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  DB_URL: "jdbc:postgresql://postgres:5432/notification_db"
  DB_USERNAME: "notification_user"
  KEYCLOAK_JWK_SET_URI: "http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs"
  ZIPKIN_ENDPOINT: "http://tempo:9411/api/v2/spans"
  # Mailpit (mail gia lap, k8s/infra/mailpit.yaml): SMTP gui, API tra cuu UNKNOWN.
  MAILPIT_API_BASE: "http://mailpit:8025"
  MAILPIT_SMTP_HOST: "mailpit"
  MAILPIT_SMTP_PORT: "1025"
  NOTIFICATION_FROM: "shop@shop-hatd.online"
  # Resolve userId -> email qua Keycloak Admin API (dung lai service account
  # ecommerce-admin cua auth-service, role view-users).
  KEYCLOAK_SERVER_URL: "http://162.4.177.91:7080"
  KEYCLOAK_ADMIN_CLIENT_ID: "ecommerce-admin"
  KEYCLOAK_ADMIN_REALM: "master"
