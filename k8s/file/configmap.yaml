apiVersion: v1
kind: ConfigMap
metadata:
  name: file-config
  namespace: ecommerce
  labels:
    app: file-service
data:
  SERVER_PORT: "8095"
  GRPC_SERVER_PORT: "9090"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
  EUREKA_SERVER_URL: "http://discovery-service:8761/eureka/"
  EUREKA_HOSTNAME: "file-service"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_PUBLIC_ENDPOINT: "http://162.4.177.91:9000"
  MINIO_BUCKET: "ecommerce-files"
  CLAMAV_HOST: "clamav"
  CLAMAV_PORT: "3310"
  CLAMAV_ENABLED: "true"
  KEYCLOAK_JWK_SET_URI: "http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs"
  ZIPKIN_ENDPOINT: "http://tempo:9411/api/v2/spans"
