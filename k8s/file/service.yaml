apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: ecommerce
  labels:
    app: file-service
spec:
  type: ClusterIP
  selector:
    app: file-service
  ports:
    - name: http
      port: 8095
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: file-service-grpc
  namespace: ecommerce
  labels:
    app: file-service
spec:
  type: ClusterIP
  selector:
    app: file-service
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
