# Exposes ONLY api-gateway:8080. Do not add routes for discovery dashboard
# (use kubectl port-forward when needed).
# Phase 4: TLS via cert-manager `gateway-tls` (self-signed ClusterIssuer until
# a real domain exists for Let's Encrypt). HTTP on `web` is kept for DEV parity.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-gateway
  namespace: ecommerce
  labels:
    app: api-gateway
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: api-gateway
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-gateway-tls
  namespace: ecommerce
  labels:
    app: api-gateway
spec:
  entryPoints:
    - websecure
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: api-gateway
          port: 8080
  tls:
    secretName: gateway-tls
