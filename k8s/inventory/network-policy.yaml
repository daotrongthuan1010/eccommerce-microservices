# NetworkPolicy inventory: gioi han ingress chi cho pod trong namespace ecommerce.
# NetworkPolicy la lop mat mang; JWT/interceptor van la lop xac thuc bat buoc.
#
# LUU Y (2026-11-07, CD incident): k3s tren VPS nay chay kube-router
# network-policy-controller built-in. Thuc nghiem: moi bien the selector
# (namespaceSelector rieng, +podSelector:{}, podSelector:{} rieng) deu chan
# ca pod trong cung namespace (smoke CD, kubectl run). Chi xoa policy thi
# moi pod trong namespace goi duoc. Vi the policy tam THOAT (khong apply
# tu dong) — file nay giu lai trang thai mong muon khi nang cap CNI
# (Calico/Cilium) hoac fix kube-router. Den khi do, ingress phai la:
#   from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ecommerce}}}]
# Den luc do bo comment nay va apply lai.
#
# Vi sao chap nhan thoat: single-node k3s, moi pod cung namespace; lop
# bao ve thuc te la JWT + resource-server. NetworkPolicy o day la defense
# in depth, khong phai ranh gioi duy nhat.
