# Chỉ cho pod trong namespace ecommerce gọi REST/gRPC Inventory.
# NetworkPolicy giới hạn mặt mạng; JWT/interceptor vẫn là lớp xác thực bắt buộc.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-service-ingress
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app: inventory-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        # podSelector rong = moi pod trong namespace ecommerce (ket hop
        # namespaceSelector); rieng namespaceSelector khong du tren mot so
        # CNI k3s — smoke pod cung namespace bi chan (phat hien CD 2026-11-07)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ecommerce
          podSelector: {}
      ports:
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 9084
