# Keycloak qua subdomain auth.shop-hatd.online (HTTPS, Traefik ACME).
# Dieu kien: DNS A `auth` -> 162.4.177.91 (Bao ve TAT) o iNET.
# Keycloak da co KC_PROXY_HEADERS=xforwarded + KC_HOSTNAME_STRICT=false
# nen qua Traefik (X-Forwarded-Proto=https) se tu sinh issuer
# https://auth.shop-hatd.online/realms/ecommerce cho request qua domain;
# truy cap bang IP:7080 nhu cu khong doi.
# HTTP -> HTTPS redirect dung lai Middleware redirect-https (namespace ecommerce).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
  namespace: ecommerce
  labels:
    app: keycloak
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`auth.shop-hatd.online`)
      kind: Rule
      priority: 50
      middlewares:
        - name: redirect-https
      services:
        - name: keycloak
          port: 7080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-tls
  namespace: ecommerce
  labels:
    app: keycloak
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.shop-hatd.online`)
      kind: Rule
      services:
        - name: keycloak
          port: 7080
  tls:
    certResolver: letsencrypt
