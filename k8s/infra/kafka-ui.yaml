# Kafka UI (provectuslabs/kafka-ui) — web console for the 3-broker cluster.
# Public for DEV/UAT at http://162.4.177.91:8090 (docs/OBSERVABILITY-GUIDE.md).
# HISTORY: kafka-ui was removed from the old compose stack for eating
# ~3Gi RAM + 700% CPU (docs/OPERATIONS.md). It is only re-added with a small
# JVM heap (-Xmx256m) and hard limits (512Mi / 500m). Do not raise casually;
# check `kubectl top pod -l app=kafka-ui` after load changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: ecommerce
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:v0.7.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: ecommerce
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka:29092
            - name: DYNAMIC_CONFIG_ENABLED
              value: "false"
            - name: JAVA_OPTS
              value: -Xms64m -Xmx256m
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: ecommerce
  labels:
    app: kafka-ui
spec:
  type: LoadBalancer
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 8090
      targetPort: http
