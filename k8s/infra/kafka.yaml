# Port of docker-compose.yml `kafka` + `kafka-init` (confluentinc/cp-kafka:7.9.2, KRaft single-node).
# In-cluster clients use kafka:29092 (ClusterIP svc `kafka`).
# External DEV clients use <VPS-IP>:9092 (LoadBalancer svc `kafka-external`,
# k3s Klipper lb preserves the compose 0.0.0.0:9092 behavior).
# NOTE: EXTERNAL advertised listener is pinned to the VPS IP below. If the VPS
# IP ever changes, update it here and roll the Deployment.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: ecommerce
  labels:
    app: kafka
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: ecommerce
  labels:
    app: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate # single KRaft node on RWO volume; never roll while mounted
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.9.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: internal
              containerPort: 29092
            - name: external
              containerPort: 9092
          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka:29093
            - name: KAFKA_LISTENERS
              value: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://kafka:29092,EXTERNAL://162.4.177.91:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - kafka-topics --bootstrap-server localhost:29092 --list >/dev/null
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - kafka-topics --bootstrap-server localhost:29092 --list >/dev/null
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-data
---
# Internal listener for pods (auth-service, user-service, ...).
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ecommerce
  labels:
    app: kafka
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: internal
      port: 29092
      targetPort: internal
---
# External listener for DEV tools on the VPS IP (compose parity: 0.0.0.0:9092).
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  namespace: ecommerce
  labels:
    app: kafka
spec:
  type: LoadBalancer
  selector:
    app: kafka
  ports:
    - name: external
      port: 9092
      targetPort: external
---
# Port of compose `kafka-init`: creates the two app event topics once kafka is Ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
  namespace: ecommerce
  labels:
    app: kafka
spec:
  backoffLimit: 30 # kafka is slow to start; retry until Ready
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: kafka-init-topics
        job-name: kafka-init-topics
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: confluentinc/cp-kafka:7.9.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecommerce.auth.events --partitions 3 --replication-factor 1
              kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecommerce.user.events --partitions 3 --replication-factor 1
              kafka-topics --bootstrap-server kafka:29092 --list
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
