apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply order is NOT guaranteed by kustomize — follow k8s/infra/README.md
# (secrets + init ConfigMaps first, then postgres/mysql/redis, then the rest).
resources:
  - postgres.yaml
  - mysql.yaml
  - redis.yaml
  - kafka.yaml
  - elasticsearch.yaml
  - minio.yaml
  - keycloak.yaml
  - clamav.yaml
  - nexus.yaml
  - monitoring.yaml # Phase 4: prometheus + grafana
  - loki.yaml # Phase 4: loki + promtail
  - tempo.yaml # Phase 4: replaces zipkin (Zipkin-format receiver)
  - cert-manager.yaml # Phase 4: CRDs applied imperatively first (see README)
  - argocd.yaml # Phase 4: CRDs applied imperatively first (see README)
  - backup.yaml # Phase 4: nightly db + minio backup CronJob
