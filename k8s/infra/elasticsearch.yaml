# Port of docker-compose.yml `elasticsearch`
# (docker.elastic.co/elasticsearch/elasticsearch:8.19.4, single-node, no security).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  namespace: ecommerce
  labels:
    app: elasticsearch
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: ecommerce
  labels:
    app: elasticsearch
spec:
  replicas: 1
  strategy:
    type: Recreate # single node on RWO volume; never roll while mounted
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      # ES runs as UID 1000; local-path provisions root-owned dirs.
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: -Xms512m -Xmx512m
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s" | grep -qE '"status":"(green|yellow)"'
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s" | grep -qE '"status":"(green|yellow)"'
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elasticsearch-data
---
# LoadBalancer (k3s Klipper lb) exposes the compose port 9200 on the node IP,
# preserving the DEV 0.0.0.0 public-access behavior from vps-infra memory.
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: ecommerce
  labels:
    app: elasticsearch
spec:
  type: LoadBalancer
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
