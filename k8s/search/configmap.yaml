apiVersion: v1
kind: ConfigMap
metadata:
  name: search-config
  namespace: ecommerce
  labels:
    app: search-service
data:
  SERVER_PORT: "8088"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
  EUREKA_SERVER_URL: "http://discovery-service:8761/eureka/"
  EUREKA_HOSTNAME: "search-service"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  ELASTICSEARCH_URIS: "http://elasticsearch:9200"
  # vi-search 2026-11-06: synonyms index-time — them dong phai reindex.
  SEARCH_SYNONYMS: "dtdd, smartphone => dien thoai, dt => dien thoai, iphone => apple iphone, macbook => apple macbook, laptop => may tinh xach tay, o to => xe hoi, xe may => xe may"
  PRODUCT_SERVICE_URL: "http://product-service"
  KEYCLOAK_JWK_SET_URI: "http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs"
  ZIPKIN_ENDPOINT: "http://tempo:9411/api/v2/spans"
