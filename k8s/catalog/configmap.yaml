apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: ecommerce
  labels:
    app: catalog-service
data:
  SERVER_PORT: "8083"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
  EUREKA_SERVER_URL: "http://discovery-service:8761/eureka/"
  EUREKA_HOSTNAME: "catalog-service"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  DB_URL: "jdbc:postgresql://postgres:5432/catalog_db"
  DB_USERNAME: "catalog_user"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_BUCKET: "product-assets"
  KEYCLOAK_JWK_SET_URI: "http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs"
  ZIPKIN_ENDPOINT: "http://tempo:9411/api/v2/spans"
