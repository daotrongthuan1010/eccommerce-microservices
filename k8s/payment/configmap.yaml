apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: ecommerce
  labels:
    app: payment-service
data:
  SERVER_PORT: "8086"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
  EUREKA_SERVER_URL: "http://discovery-service:8761/eureka/"
  EUREKA_HOSTNAME: "payment-service"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  REDIS_HOST: "162.4.177.91"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "162.4.177.91:9092"
  DB_URL: "jdbc:mysql://162.4.177.91:3306/payment_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
  DB_USERNAME: "payment_user"
  KEYCLOAK_JWK_SET_URI: "http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs"
  ZIPKIN_ENDPOINT: "http://162.4.177.91:9411/api/v2/spans"
