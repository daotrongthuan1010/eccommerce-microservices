apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: ecommerce
  labels:
    app: auth-service
data:
  SERVER_PORT: "8081"
  GRPC_SERVER_PORT: "9081"
  EUREKA_SERVER_URL: "http://discovery-service:8761/eureka/"
  EUREKA_HOSTNAME: "auth-service"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  DB_URL: "jdbc:mysql://mysql:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
  DB_USERNAME: "auth_user"
  # auth_db đã có bảng từ trước khi bật Flyway -> baseline schema hiện có rồi mới migrate tiếp.
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  KEYCLOAK_JWK_SET_URI: "http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs"
  KEYCLOAK_ISSUER_URI: "http://162.4.177.91:7080/realms/ecommerce"
  KEYCLOAK_TOKEN_URI: "http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/token"
  KEYCLOAK_LOGOUT_URI: "http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/logout"
  KEYCLOAK_SERVER_URL: "http://162.4.177.91:7080"
  KEYCLOAK_REALM: "ecommerce"
  KEYCLOAK_ADMIN_REALM: "master"
  KEYCLOAK_CLIENT_ID: "ecommerce-app"
  # Service-account client cho Keycloak Admin API. Repo giu gia tri that dang
  # chay tren cluster ('ecommerce-admin'); secret that cap qua Secret/env ngoai.
  # De trong = tat register/forgot/change-password (tra 501 kem huong dan thu cong).
  KEYCLOAK_ADMIN_CLIENT_ID: "ecommerce-admin"
  IAM_PROVISION_ENABLED: "true"
  # Ma tenant mac dinh (phai co trong seed neu dung). De trong = provision
  # user muc he thong, khong gan tenant (khop default application.yml).
  # Dat ma that (VD "DEFAULT") khi da seed tenants.
  IAM_DEFAULT_TENANT: ""
  ZIPKIN_ENDPOINT: "http://tempo:9411/api/v2/spans"
