apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-config
  namespace: ecommerce
  labels:
    app: analytics-service
data:
  SERVER_PORT: "8094"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
  EUREKA_SERVER_URL: "http://discovery-service:8761/eureka/"
  EUREKA_HOSTNAME: "analytics-service"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  DB_URL: "jdbc:postgresql://postgres:5432/analytics_db"
  DB_USERNAME: "analytics_user"
  KEYCLOAK_JWK_SET_URI: "http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs"
  ZIPKIN_ENDPOINT: "http://tempo:9411/api/v2/spans"
