# Image tag: replace __IMAGE_TAG__ with <sha> at rollout time (see k8s/auth/deployment.yaml header).
# Secret analytics-secrets must exist before apply (see secret-template.yaml.example header).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: ecommerce
  labels:
    app: analytics-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: analytics-service
          image: daotrongthuan/analytics-service:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8094
          envFrom:
            - configMapRef:
                name: analytics-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-secrets
                  key: db-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-secrets
                  key: redis-password
          resources:
            requests:
              cpu: 150m
              memory: 300Mi
            limits:
              cpu: 300m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
