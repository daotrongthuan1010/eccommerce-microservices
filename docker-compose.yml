name: ${COMPOSE_PROJECT_NAME:-eccommerce}
services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Copy .env.example to .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set DB password}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set DB password}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Set DB password}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set DB password}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set DB password}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U postgres -d postgres && test -f /var/lib/postgresql/data/.initialized
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  mysql:
    image: mysql:8.4.6
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MySQL root password}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set DB password}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Set DB password}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set DB password}
    volumes:
    - mysql-data:/var/lib/mysql
    - ./infra/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -uroot
        -e "SELECT 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:6379:6379
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set Redis password}
    command:
    - sh
    - -c
    - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  kafka:
    image: confluentinc/cp-kafka:7.9.2
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:9092:9092
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-topics --bootstrap-server kafka:29092 --list >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:9200:9200
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
    - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s"
        | grep -qE '"status":"(green|yellow)"'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:9000:9000
    - 0.0.0.0:9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MinIO user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MinIO password}
      MINIO_API_PORT_NUMBER: '9000'
      MINIO_CONSOLE_PORT_NUMBER: '9001'
    volumes:
    - minio-data:/bitnami/minio/data
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  minio-init:
    image: bitnamilegacy/minio:latest
    networks:
    - ecommerce
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
    - /bin/bash
    - -ec
    command:
    - /opt/bitnami/minio-client/bin/mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
      /opt/bitnami/minio-client/bin/mc mb --ignore-existing local/product-assets
  kafka-init:
    image: confluentinc/cp-kafka:7.9.2
    networks:
    - ecommerce
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecommerce.auth.events --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecommerce.user.events --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:29092 --list
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:7080:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set Keycloak admin password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set DB password}
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_PROXY_HEADERS: xforwarded
    volumes:
    - ./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    command:
    - start-dev
    - --import-realm
    - --health-enabled=true
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:8090:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:8091:8081
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:?Set Redis password}
  prometheus:
    image: prom/prometheus:v3.0.0
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:9090:9090
    volumes:
    - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set Grafana password}
    volumes:
    - grafana-data:/var/lib/grafana
    - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
  zipkin:
    image: openzipkin/zipkin:3.4.1
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:9411:9411
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:9100:9100
    command:
    - --path.rootfs=/host
    - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
    - /:/host:ro,rslave
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:8089:8080
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    - /dev/disk/:/dev/disk:ro
  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.9.0
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:9114:9114
    command:
    - --es.uri=http://elasticsearch:9200
    - --es.all
    depends_on:
      elasticsearch:
        condition: service_healthy
  discovery-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: discovery-service
    image: eccommerce/discovery-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:8761:8761
    environment:
      SERVER_PORT: '8761'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      EUREKA_HOSTNAME: discovery-service
      ZIPKIN_ENDPOINT: http://162.4.177.91:9411/api/v2/spans
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8761/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  api-gateway:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    image: eccommerce/api-gateway:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:8080:8080
    environment:
      SERVER_PORT: '8080'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      AUTH_SERVICE_URL: lb://auth-service
      USER_SERVICE_URL: lb://user-service
      CATALOG_SERVICE_URL: lb://catalog-service
      INVENTORY_SERVICE_URL: lb://inventory-service
      ORDER_SERVICE_URL: lb://order-service
      PAYMENT_SERVICE_URL: lb://payment-service
      NOTIFICATION_SERVICE_URL: lb://notification-service
      SEARCH_SERVICE_URL: lb://search-service
      EUREKA_SERVER_URL: http://162.4.177.91:8761/eureka/
      EUREKA_HOSTNAME: api-gateway
      ZIPKIN_ENDPOINT: http://162.4.177.91:9411/api/v2/spans
      KEYCLOAK_JWK_SET_URI: http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      discovery-service:
        condition: service_started
  auth-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    image: eccommerce/auth-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:8081:8081
    environment:
      SERVER_PORT: '8081'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: 162.4.177.91
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: 162.4.177.91:9092
      DB_URL: jdbc:mysql://162.4.177.91:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      EUREKA_SERVER_URL: http://162.4.177.91:8761/eureka/
      EUREKA_HOSTNAME: auth-service
      ZIPKIN_ENDPOINT: http://162.4.177.91:9411/api/v2/spans
      KEYCLOAK_JWK_SET_URI: http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: ecommerce-app
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8081/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      discovery-service:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
  user-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user-service
    image: eccommerce/user-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:8082:8082
    environment:
      SERVER_PORT: '8082'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: 162.4.177.91
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: 162.4.177.91:9092
      DB_URL: jdbc:mysql://162.4.177.91:3306/user_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: user_user
      DB_PASSWORD: ${USER_DB_PASSWORD}
      EUREKA_SERVER_URL: http://162.4.177.91:8761/eureka/
      EUREKA_HOSTNAME: user-service
      ZIPKIN_ENDPOINT: http://162.4.177.91:9411/api/v2/spans
      KEYCLOAK_JWK_SET_URI: http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8082/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      discovery-service:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
  catalog-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: catalog-service
    image: eccommerce/catalog-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:8083:8083
    environment:
      SERVER_PORT: '8083'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: 162.4.177.91
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: 162.4.177.91:9092
      DB_URL: jdbc:postgresql://162.4.177.91:5432/catalog_db
      DB_USERNAME: catalog_user
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      MINIO_ENDPOINT: http://162.4.177.91:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: product-assets
      EUREKA_SERVER_URL: http://162.4.177.91:8761/eureka/
      EUREKA_HOSTNAME: catalog-service
      ZIPKIN_ENDPOINT: http://162.4.177.91:9411/api/v2/spans
      KEYCLOAK_JWK_SET_URI: http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8083/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      discovery-service:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
  inventory-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: inventory-service
    image: eccommerce/inventory-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:8084:8084
    environment:
      SERVER_PORT: '8084'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: 162.4.177.91
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: 162.4.177.91:9092
      DB_URL: jdbc:postgresql://162.4.177.91:5432/inventory_db
      DB_USERNAME: inventory_user
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      EUREKA_SERVER_URL: http://162.4.177.91:8761/eureka/
      EUREKA_HOSTNAME: inventory-service
      ZIPKIN_ENDPOINT: http://162.4.177.91:9411/api/v2/spans
      KEYCLOAK_JWK_SET_URI: http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8084/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      discovery-service:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
  order-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    image: eccommerce/order-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:8085:8085
    environment:
      SERVER_PORT: '8085'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: 162.4.177.91
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: 162.4.177.91:9092
      DB_URL: jdbc:postgresql://162.4.177.91:5432/order_db
      DB_USERNAME: order_user
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      EUREKA_SERVER_URL: http://162.4.177.91:8761/eureka/
      EUREKA_HOSTNAME: order-service
      ZIPKIN_ENDPOINT: http://162.4.177.91:9411/api/v2/spans
      KEYCLOAK_JWK_SET_URI: http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8085/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      discovery-service:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
  payment-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    image: eccommerce/payment-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:8086:8086
    environment:
      SERVER_PORT: '8086'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: 162.4.177.91
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: 162.4.177.91:9092
      DB_URL: jdbc:mysql://162.4.177.91:3306/payment_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: payment_user
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      EUREKA_SERVER_URL: http://162.4.177.91:8761/eureka/
      EUREKA_HOSTNAME: payment-service
      ZIPKIN_ENDPOINT: http://162.4.177.91:9411/api/v2/spans
      KEYCLOAK_JWK_SET_URI: http://162.4.177.91:7080/realms/ecommerce/protocol/openid-connect/certs
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8086/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      discovery-service:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
  notification-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    image: eccommerce/notification-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 0.0.0.0:8087:8087
    environment:
      SERVER_PORT: '8087'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: 162.4.177.91
