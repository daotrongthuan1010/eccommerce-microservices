name: ${COMPOSE_PROJECT_NAME:-eccommerce}
services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Copy .env.example to .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set DB password}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Set DB password}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set DB password}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set DB password}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U postgres -d postgres && test -f /var/lib/postgresql/data/.initialized
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  mysql:
    image: mysql:8.4.6
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MySQL root password}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set DB password}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Set DB password}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set DB password}
    volumes:
    - mysql-data:/var/lib/mysql
    - ./infra/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -uroot
        -e "SELECT 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:6379:6379
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set Redis password}
    command:
    - sh
    - -c
    - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  kafka:
    image: confluentinc/cp-kafka:7.9.2
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:9092:9092
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-topics --bootstrap-server kafka:29092 --list >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:9200:9200
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
    - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s"
        | grep -qE '"status":"(green|yellow)"'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MinIO user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MinIO password}
    command:
    - server
    - /data
    - --console-address
    - :9001
    volumes:
    - minio-data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    networks:
    - ecommerce
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
      mc mb --ignore-existing local/product-assets
  api-gateway:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    image: eccommerce/api-gateway:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:8080:8080
    environment:
      SERVER_PORT: '8080'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      CATALOG_SERVICE_URL: http://catalog-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      ORDER_SERVICE_URL: http://order-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      SEARCH_SERVICE_URL: http://search-service:8088
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  auth-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    image: eccommerce/auth-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:8081:8081
    environment:
      SERVER_PORT: '8081'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:mysql://mysql:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8081/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
  user-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user-service
    image: eccommerce/user-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:8082:8082
    environment:
      SERVER_PORT: '8082'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:mysql://mysql:3306/user_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: user_user
      DB_PASSWORD: ${USER_DB_PASSWORD}
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8082/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
  catalog-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: catalog-service
    image: eccommerce/catalog-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:8083:8083
    environment:
      SERVER_PORT: '8083'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USERNAME: catalog_user
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: product-assets
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8083/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
  inventory-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: inventory-service
    image: eccommerce/inventory-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:8084:8084
    environment:
      SERVER_PORT: '8084'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: inventory_user
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8084/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
  order-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    image: eccommerce/order-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:8085:8085
    environment:
      SERVER_PORT: '8085'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: order_user
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8085/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
  payment-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    image: eccommerce/payment-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:8086:8086
    environment:
      SERVER_PORT: '8086'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:mysql://mysql:3306/payment_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: payment_user
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8086/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
  notification-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    image: eccommerce/notification-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:8087:8087
    environment:
      SERVER_PORT: '8087'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: notification_user
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8087/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
  search-service:
    profiles:
    - apps
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: search-service
    image: eccommerce/search-service:local
    restart: unless-stopped
    networks:
    - ecommerce
    ports:
    - 127.0.0.1:8088:8088
    environment:
      SERVER_PORT: '8088'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ELASTICSEARCH_URIS: http://elasticsearch:9200
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8088/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
networks:
  ecommerce:
    driver: bridge
volumes:
  postgres-data: {}
  mysql-data: {}
  redis-data: {}
  kafka-data: {}
  minio-data: {}
  elasticsearch-data: {}
